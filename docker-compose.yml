services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintainer
      POSTGRES_PASSWORD: maintainer
      POSTGRES_DB: maintainer
    ports:
      - "5432:5432"
    volumes:
      - maintainer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maintainer_pg:
